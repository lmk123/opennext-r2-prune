# 推送 vX.Y.Z 形式的 tag 时发布到 npm。
# 用 npm Trusted Publishing（OIDC）认证，不需要 NPM_TOKEN；需要先在 npmjs.com 包设置的
# Trusted Publisher 里登记本仓库和这个文件名（publish.yml），改文件名要同步改那边。
name: publish

on:
  push:
    tags:
      # 只认正式版本：npm publish 不带 --tag 会把版本发到 latest，预发布版本不能走这里
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write # Trusted Publishing 靠 OIDC token 认证，同时自动生成 provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 下面要判断 tag 指向的提交是否已在 main 上，需要完整历史

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted Publishing 需要 npm >= 11.5.1；setup-node 可能用上 runner 缓存里较早的 24.x，自带的 npm 不一定够新
      - run: npm install -g npm@latest

      - name: 核对 tag 与 package.json 版本一致、已合入 main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的版本 ${version} 不一致：删掉这个 tag，改好版本号合并后重新打 v${version}"
            exit 1
          fi
          # npm 的版本号发过就不能重用，没合并的代码不能发出去
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} 指向的提交不在 main 上：删掉这个 tag，先把 PR 合并，再在 main 上重新打 ${GITHUB_REF_NAME}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # 用 npm 而不是 pnpm 发布：Trusted Publishing 由 npm CLI 实现；prepare 会先重新构建 dist
      - run: npm publish
